# =========================================
# MySQL Database Configuration
# =========================================

# MySQL database connection URL
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy_management?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true

# MySQL username
spring.datasource.username=root

# MySQL password
spring.datasource.password=20030704

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================
# JPA / Hibernate Configuration
# =========================================

# Automatically update database tables according to Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in IntelliJ console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true